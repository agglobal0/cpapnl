services:
  # 1. Frontend Static Site
  - type: web
    name: cpapnl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend PHP API Service (via Docker)
  - type: web
    name: cpapnl-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: sqlite
